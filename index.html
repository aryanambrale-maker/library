<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>My Library</h1>
    <button id="new-book-btn" class="btn primary-btn">+ New Book</button>
  </header>

  <main class="container">
    <div id="library-grid" class="library-grid"></div>
  </main>

  <dialog id="book-dialog" class="book-dialog">
    <form id="book-form">
      <h2>Add New Book</h2>
      
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" required>
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" required>
      </div>

      <div class="form-group">
        <label for="pages">Pages</label>
        <input type="number" id="pages" min="1" required>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="read">
        <label for="read">I have read this book</label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn secondary-btn">Cancel</button>
        <button type="submit" class="btn primary-btn">Add Book</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
